[project]
name = "atomik-meme"
version = "0.1.0"
description = "Analyse, name, and categorise meme image collections using a local Ollama vision model."
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pillow>=10.3",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "rapidfuzz>=3.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
atomik-meme = "atomik_meme.cli:app"
atomik-meme-web = "atomik_meme_web.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atomik_meme", "src/atomik_meme_web"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Third-party-only: raised inside fastapi/starlette's own TestClient module on import/
    # construction, not by anything atomik-meme-web does. Nothing to fix on our side; revisit if/when
    # httpx2 (or a starlette release without this warning) becomes the supported combination.
    # (StarletteDeprecationWarning subclasses UserWarning, not DeprecationWarning -- category
    # left blank below so the message match applies regardless of which warning class is used.)
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
